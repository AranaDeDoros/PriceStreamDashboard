[project]
name = "Stream-Price-Dashboard"
description = "A dashboard for monitoring price streams"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "bcrypt==3.2.2",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "cryptography==46.0.5",
    "ecdsa==0.19.1",
    "fastapi==0.129.0",
    "fastapi-throttle==0.1.8",
    "greenlet==3.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "iniconfig==2.3.0",
    "jwt==1.4.0",
    "loguru==0.7.3",
    "packaging==26.0",
    "passlib==1.7.4",
    "pluggy==1.6.0",
    "psycopg2-binary==2.9.11",
    "pyasn1==0.6.2",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "Pygments==2.19.2",
    "pytest==9.0.2",
    "python-dotenv==1.2.1",
    "python-jose==3.5.0",
    "python-multipart==0.0.22",
    "rsa==4.9.1",
    "ruff==0.4.8",
    "six==1.17.0",
    "SQLAlchemy==2.0.46",
    "starlette==0.52.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.40.0",
    "win32_setctime==1.2.0",
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "pluggy==1.6.0", "iniconfig==2.3.0", "Pygments==2.19.2"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "__pycache__", "migrations", "alembic", "env.py", "venv"]

[tool.ruff.lint]
select = [
    "E",    # Error
    "W",    # Warning
    "F",    # Pyflakes
    "C",    # Complexity
    "I",    # Isort
    "N",    # Naming
    "D",    # Docstrings (optional, but good practice)
    "UP",   # Pyupgrade
    "B",    # Bugbear
    "A",    # Builtin shadowing
    "TID",  # flake8-tidy-imports
    "PERF", # Perflint
    "RUF",  # Ruff-specific rules
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in public function
    "D107", # Missing docstring in __init__
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "B008", # Do not perform function call `Depends` in argument defaults
    "E712", # Avoid equality comparisons to `False`
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "auto"
