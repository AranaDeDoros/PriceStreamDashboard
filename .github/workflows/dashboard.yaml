name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: camel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      EXTERNAL_API_URL: http://price-stream-service:8080/api/ # scala service
      HOME_URL: http://localhost:5173
      LOCAL_URL: http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg2://test_user:123456@localhost:5432/camel
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build
          pip install pytest-cov

      - name: Ruff format
        run: ruff format .

      - name: Ruff check
        run: ruff check . --fix

      - name: Ensure no formatting changes
        run: git diff --exit-code

      - name: Build package
        run: python -m build

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            sleep 2
          done

      - name: Run tests with coverage
        run: pytest -q
